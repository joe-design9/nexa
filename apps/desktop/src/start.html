<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Nexa – Server verbinden</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0B0B12; color:#E7E7F0; font-family: Inter, system-ui, sans-serif; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; }
  .logo { filter: drop-shadow(0 0 22px rgba(124,92,255,.55)); }
  .npath { stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 1.2s ease forwards .1s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  h1 { margin:4px 0 0; font-size:26px; letter-spacing:.3em; text-indent:.3em; }
  p { color:#9A9AB0; max-width:460px; text-align:center; line-height:1.5; margin:0; }
  form { display:flex; gap:10px; width:min(520px, 92vw); margin-top:8px; }
  input { flex:1; background:#171724; border:1px solid #262638; color:#E7E7F0; border-radius:10px; padding:12px 14px; font-size:15px; outline:none; }
  input:focus { border-color:#7C5CFF; }
  button { background:linear-gradient(120deg,#7C5CFF,#22D3EE); color:#fff; border:0; border-radius:10px; padding:12px 20px; font-weight:700; cursor:pointer; font-size:15px; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { color:#F04747; min-height:20px; text-align:center; max-width:520px; }
  .hint { font-size:12px; color:#6d6d84; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="logo" width="110" height="110" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
      </defs>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="#12121C"/>
      <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#g)" stroke-width="10"/>
      <path class="npath" d="M150 362 V150 L362 362 V150" fill="none" stroke="url(#g)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>NEXA</h1>
    <p id="intro">Verbinde dich mit deinem Nexa-Server. Die Adresse zeigt auf die <b>Nexa-Web-Oberfläche</b> (Standard: Port 3000). Die API-Adresse wird beim Erstellen/Bereitstellen der Web-App festgelegt.</p>
    <div class="err" id="err"></div>
    <form id="form">
      <input id="url" type="text" placeholder="http://localhost:3000" autocomplete="off" spellcheck="false" />
      <button id="btn" type="submit">Verbinden</button>
    </form>
    <div class="hint" id="hint">Die URL wird lokal in nexa-config.json gespeichert und beim nächsten Start automatisch verwendet.</div>
  </div>
<script>
  // Startseite folgt der Systemsprache; die eigentliche UI-Sprache wird in der Web-App umgeschaltet.
  const STR = {
    de: {
      title: 'Nexa – Server verbinden',
      intro: 'Verbinde dich mit deinem Nexa-Server. Die Adresse zeigt auf die <b>Nexa-Web-Oberfläche</b> (Standard: Port 3000). Die API-Adresse wird beim Erstellen/Bereitstellen der Web-App festgelegt.',
      connect: 'Verbinden',
      connecting: 'Verbinde …',
      hint: 'Die URL wird lokal in nexa-config.json gespeichert und beim nächsten Start automatisch verwendet.',
      noBridge: 'Desktop-Brücke nicht verfügbar (Preload fehlt).',
      unreachable: 'Server nicht erreichbar.',
      errorPrefix: 'Fehler: ',
    },
    en: {
      title: 'Nexa – Connect to server',
      intro: 'Connect to your Nexa server. The address points to the <b>Nexa web interface</b> (default: port 3000). The API address is set when the web app is created/deployed.',
      connect: 'Connect',
      connecting: 'Connecting …',
      hint: 'The URL is stored locally in nexa-config.json and used automatically on the next start.',
      noBridge: 'Desktop bridge unavailable (preload missing).',
      unreachable: 'Server unreachable.',
      errorPrefix: 'Error: ',
    },
  };
  const lang = navigator.language && navigator.language.toLowerCase().startsWith('de') ? 'de' : 'en';
  const S = STR[lang];
  document.documentElement.lang = lang;
  document.title = S.title;
  document.getElementById('intro').innerHTML = S.intro;
  document.getElementById('hint').textContent = S.hint;
  const errEl = document.getElementById('err');
  const input = document.getElementById('url');
  const btn = document.getElementById('btn');
  btn.textContent = S.connect;
  function showErr(msg) { errEl.textContent = msg || ''; }
  if (window.__NEXA_START_ERROR__) showErr(window.__NEXA_START_ERROR__);
  document.addEventListener('nexa-start-error', () => showErr(window.__NEXA_START_ERROR__));
  if (window.nexaDesktop) {
    window.nexaDesktop.getServerUrl().then((u) => { if (u && !input.value) input.value = u; }).catch(() => {});
  } else {
    showErr(S.noBridge);
  }
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = input.value.trim() || 'http://localhost:3000';
    btn.disabled = true; btn.textContent = S.connecting; showErr('');
    try {
      const res = await window.nexaDesktop.setServerUrl(url);
      if (!res.ok) showErr(res.error || S.unreachable);
    } catch (err) {
      showErr(S.errorPrefix + (err && err.message ? err.message : err));
    } finally {
      btn.disabled = false; btn.textContent = S.connect;
    }
  });
</script>
</body>
</html>
